        // Auxiliar: Convertir HH:MM a minutos desde medianoche

            const [h, m] = timeStr.split(':').map(Number);

        }

        // Auxiliar: Convertir minutos desde medianoche a HH:MM
        function minToTime(mins) {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = (mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        }

        function App() {

            const [modalAsignacion, setModalAsignacion] = useState(null);
            const [notificacion, setNotificacion] = useState(null);

            // Estado de las sesiones con Historial de Versiones (Undo/Redo)
            const [sesiones, setSesionesState] = useState(() => ({
                ...ESTRUCTURA_INAMOVIBLE,
                ...PISCINA_SEMANA_1
            }));

            // Pilas para Undo/Redo solicitadas por Viole
            const [historialPast, setHistorialPast] = useState([]);
            const [historialFuture, setHistorialFuture] = useState([]);

            // Wrapper para guardar cambios con historial
            const setSesiones = useCallback((nuevoEstado, registrarHistorial = true) => {
                setSesionesState(prev => {
                    const proximo = typeof nuevoEstado === 'function' ? nuevoEstado(prev) : nuevoEstado;
                    if (registrarHistorial) {
                        setHistorialPast(past => [...past, prev]);
                        setHistorialFuture([]); // Limpiar futuro al hacer nuevo cambio
                    }
                    return proximo;
                });
            }, []);

            // Función Deshacer (Undo)
            const deshacer = () => {
                if (historialPast.length === 0) return;
                const anterior = historialPast[historialPast.length - 1];
                setHistorialPast(past => past.slice(0, past.length - 1));
                setHistorialFuture(future => [sesiones, ...future]);
                setSesionesState(anterior);
                setNotificacion({ tipo: "info", mensaje: "Acción deshecha correctamente." });
                setTimeout(() => setNotificacion(null), 3000);
            };

            // Función Rehacer (Redo)
            const rehacer = () => {
                if (historialFuture.length === 0) return;
                const siguiente = historialFuture[0];
                setHistorialFuture(future => future.slice(1));
                setHistorialPast(past => [...past, sesiones]);
                setSesionesState(siguiente);
                setNotificacion({ tipo: "info", mensaje: "Acción rehecha." });
                setTimeout(() => setNotificacion(null), 3000);
            };

            // Sincronizar semana de piscina
            useEffect(() => {
                setSesiones(prev => {
                    const limpia = { ...prev };
                    Object.keys(limpia).forEach(k => {
                        if (limpia[k]?.tipo === "PISCINA") {
                            delete limpia[k];
                        }
                    });
                    const piscinaNueva = semana === "1" ? PISCINA_SEMANA_1 : PISCINA_SEMANA_2;
                    return { ...limpia, ...piscinaNueva };
                }, false);
            }, [semana]);

            // Vaciar cuadrante preservando la estructura inamovible
            const vaciarCuadrante = () => {
                const piscinaActual = semana === "1" ? PISCINA_SEMANA_1 : PISCINA_SEMANA_2;
                setSesiones({
                    ...ESTRUCTURA_INAMOVIBLE,
                    ...piscinaActual
                });
                setNotificacion({
                    tipo: "info",
                    mensaje: "Cuadrante vaciado. Se conservan reuniones, piscina y descansos fijos."
                });
                setTimeout(() => setNotificacion(null), 4000);
            };

            // ALGORITMO AUTO-GENERADOR INTELIGENTE (1 SESIÓN MÁX POR DÍA POR ALUMNO + CUMPLIMIENTO DE OBSERVACIONES)
            const generarCuadranteAutomatico = () => {
                const piscinaActual = semana === "1" ? PISCINA_SEMANA_1 : PISCINA_SEMANA_2;
                const copia = {
                    ...ESTRUCTURA_INAMOVIBLE,
                    ...piscinaActual
                };

                // 1. Seguimiento estricto de días asignados por alumno
                const diasAsignadosPorAlumno = {};
                CATALOGO_ALUMNOS.forEach(a => {
                    diasAsignadosPorAlumno[a.nombre] = new Set();
                });

                // Registrar las sesiones fijas de piscina para no duplicar días
                Object.values(piscinaActual).forEach(p => {
                    if (p.alumno && diasAsignadosPorAlumno[p.alumno]) {
                        const key = Object.keys(piscinaActual).find(k => piscinaActual[k] === p);
                        if (key) {
                            const parts = key.split('_');
                            if (parts.length >= 2) diasAsignadosPorAlumno[p.alumno].add(parts[1]);
                        }
                    }
                });

                // Horarios principales de inicio recomendados de 45 min
                const HORARIOS_INICIO_SESION = ["09:00", "09:45", "10:30", "11:30", "12:15", "13:00", "13:45", "15:00", "15:45"];

                // Asignar alumnos uno a uno
                CATALOGO_ALUMNOS.forEach(alumno => {
                    let asignadas = Object.values(copia).filter(s => s.alumno === alumno.nombre).length;
                    const meta = alumno.cuota;

                    if (asignadas >= meta) return;

                    // Reparto Lunes a Viernes (Máximo 1 por día)
                    for (let d = 0; d < DIAS.length && asignadas < meta; d++) {
                        const dia = DIAS[d];

                        // REGLA CRÍTICA SOLICITADA POR VIOLE: Si el alumno YA tiene sesión este día, SALTAR
                        if (diasAsignadosPorAlumno[alumno.nombre].has(dia)) {
                            continue;
                        }

                        let asignado = false;

                        for (let h = 0; h < HORARIOS_INICIO_SESION.length && !asignado; h++) {
                            const hora = HORARIOS_INICIO_SESION[h];
                            const horaMin = timeToMin(hora);

                            // REGLAS ESPECÍFICAS DE OBSERVACIONES
                            if (alumno.nombre.includes("ETHAN") && horaMin < timeToMin("10:15")) continue; // Ruta llega 10:15
                            if (alumno.nombre.includes("VALENTINA") && horaMin < timeToMin("10:45")) continue; // Ruta 10:45
                            if (alumno.nombre.includes("MARCOS") && horaMin < timeToMin("10:00")) continue; // Ruta 10:00
                            if (alumno.nombre.includes("BALLESTEROS") && horaMin < timeToMin("09:30")) continue; // Llega 9:30-10:00
                            if (alumno.nombre.includes("VELASCO") && horaMin >= timeToMin("14:30")) continue; // No fisio después de comer
                            if (alumno.nombre.includes("BUSTAMANTE") && hora === "14:30") continue; // No fisio a 14:30
                            if (alumno.nombre.includes("PLAZA") && (hora !== "15:00" && hora !== "15:45" && hora !== "13:45")) continue; // Fisio última hora
                            if (alumno.nombre.includes("RADA") && (hora !== "15:00" && hora !== "15:45")) continue; // Fisio última hora

                            // Comprobar conflicto con Logopedia o TO
                            const conflictoMultidisciplinar = HORARIOS_OTRAS_DISCIPLINAS.some(o => {
                                if (o.alumno !== alumno.nombre || o.dia !== dia) return false;
                                const oInicio = timeToMin(o.hora);
                                const oFin = oInicio + o.duracion;
                                const sInicio = horaMin;
                                const sFin = sInicio + 45;
                                return (sInicio < oFin && sFin > oInicio);
                            });
                            if (conflictoMultidisciplinar) continue;

                            // Comprobar que el alumno no esté ya en otra clase a esta hora
                            const yaOcupadoEnHora = Object.entries(copia).some(([k, v]) => {
                                const [f, d_k, h_k] = k.split('_');
                                if (d_k !== dia || v.alumno !== alumno.nombre) return false;
                                const kMin = timeToMin(h_k);
                                return (Math.abs(kMin - horaMin) < 45);
                            });
                            if (yaOcupadoEnHora) continue;

                            // Probar fisioterapeutas libres
                            for (let f = 0; f < FISIOTERAPEUTAS.length && !asignado; f++) {
                                const fisio = FISIOTERAPEUTAS[f];
                                const key = `${fisio}_${dia}_${hora}`;

                                // Comprobar que los 45 min del fisio estén libres
                                const fisioOcupado = [0, 15, 30].some(offset => {
                                    const subHora = minToTime(horaMin + offset);
                                    return copia[`${fisio}_${dia}_${subHora}`] !== undefined;
                                });

                                if (!fisioOcupado) {
                                    copia[key] = {
                                        tipo: "INDIVIDUAL",
                                        label: alumno.nombre,
                                        alumno: alumno.nombre,
                                        duracion: 45
                                    };
                                    diasAsignadosPorAlumno[alumno.nombre].add(dia);
                                    asignadas++;
                                    asignado = true;
                                }
                            }
                        }
                    }
                });

                setSesiones(copia);
                setNotificacion({
                    tipo: "exito",
                    mensaje: "¡Cuadrante autogenerado con éxito! Se garantiza MÁXIMO 1 sesión al día por usuario y respeto estricto de rutas y disciplinas."
                });
                setTimeout(() => setNotificacion(null), 5000);
            };

            const auditoria = useMemo(() => {

                    const count = Object.values(sesiones).filter(s => s.alumno === alumno.nombre).length;
                    if (count < alumno.cuota) {

                                        }`}

                                    <select
                                        value={fisioSeleccionado}
                                        onChange={e => setFisioSeleccionado(e.target.value)}
                                        className="w-full sm:w-auto bg-slate-900 border border-slate-700 text-white font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                    >
                                        {FISIOTERAPEUTAS.map(f => (
                                            <option key={f} value={f}>{f}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="bg-slate-800/80 rounded-2xl border border-slate-700 overflow-x-auto shadow-2xl max-h-[70vh]">
                                    <table className="w-full text-left border-collapse min-w-[650px]">
                                        <thead className="sticky top-0 z-20 bg-slate-900 border-b border-slate-700 text-xs">
                                            <tr>
                                                <th className="p-2.5 font-bold w-20 text-center border-r border-slate-700 sticky left-0 bg-slate-900 z-30">Hora (15m)</th>
                                                {DIAS.map(d => (
                                                    <th key={d} className="p-2.5 font-bold text-center border-r border-slate-700/50 last:border-0">
                                                        {d}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/30 text-xs">
                                            {(() => {
                                                const skipMapDia = {};
                                                DIAS.forEach(d => { skipMapDia[d] = 0; });

                                                return HORARIOS_15MIN.map(hora => (
                                                    <tr key={hora} className="hover:bg-slate-700/20">
                                                        <td className="p-1.5 text-center font-bold text-slate-400 border-r border-b border-slate-700 bg-slate-900/50 sticky left-0 z-10 text-[11px]">
                                                            {hora}
                                                        </td>
                                                        {DIAS.map(dia => {
                                                            if (skipMapDia[dia] > 0) {
                                                                skipMapDia[dia]--;
                                                                return null;
                                                            }

                                                            const key = `${fisioSeleccionado}_${dia}_${hora}`;
                                                            const s = sesiones[key];

                                                            let span = 1;
                                                            let bg = "bg-slate-900/30 text-slate-500 cursor-pointer hover:bg-slate-700/40 border-b border-slate-800/40";
                                                            let label = "+";

                                                            if (s) {
                                                                const dur = s.duracion || 45;
                                                                span = Math.max(1, Math.round(dur / 15));
                                                                skipMapDia[dia] = span - 1;

                                                                if (s.tipo === "COORDINACION") {
                                                                    bg = "bg-purple-950/90 border border-purple-500/50 text-purple-200 font-bold shadow-inner";
                                                                    label = s.label;
                                                                } else if (s.tipo === "PISCINA") {
                                                                    bg = "bg-cyan-950/90 border border-cyan-500/60 text-cyan-200 font-bold shadow-inner";
                                                                    label = s.label;
                                                                } else if (s.tipo === "RESPI") {
                                                                    bg = "bg-teal-950/90 border border-teal-500/60 text-teal-200 font-bold shadow-inner";
                                                                    label = s.label;
                                                                } else if (s.tipo === "DESAYUNO") {
                                                                    bg = "bg-slate-800/80 text-slate-400 italic text-[10px]";
                                                                    label = s.label;
                                                                } else if (s.tipo === "DESAHABILITADO") {
                                                                    bg = "bg-slate-950/90 text-slate-600";
                                                                    label = s.label;
                                                                } else if (s.tipo === "INDIVIDUAL") {
                                                                    bg = "bg-emerald-950/90 border border-emerald-500/60 text-emerald-200 font-bold cursor-pointer hover:bg-emerald-900/80 shadow-inner";
                                                                    label = s.alumno;
                                                                }
                                                            }

                                                            return (
                                                                <td
                                                                    key={key}
                                                                    rowSpan={span}
                                                                    onClick={() => abrirModalAsignacion(fisioSeleccionado, dia, hora)}
                                                                    className={`p-2 text-center border-r border-b border-slate-700/40 align-middle transition-all text-[11px] ${bg}`}
                                                                >
                                                                    <div className="flex flex-col items-center justify-center h-full gap-0.5 min-h-[32px]">
                                                                        <span className="truncate max-w-[120px]" title={label}>
                                                                            {label}
                                                                        </span>
                                                                        {s && s.tipo === "INDIVIDUAL" && (
                                                                            <span className="text-[9px] text-emerald-400/80 font-normal">
                                                                                (45 min)
                                                                            </span>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ));
                                            })()}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VISTA 3: NUEVA VISTA POR ALUMNO SOLICITADA POR VIOLE */}
                        {vistaActual === "alumno" && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-800/50 p-3.5 rounded-2xl border border-slate-700">
                                    <div className="flex items-center gap-3">
                                        <i className="fa-solid fa-user-graduate text-indigo-400 text-lg"></i>
                                        <span className="text-xs sm:text-sm font-semibold text-slate-300">Seleccionar Alumno:</span>
                                    </div>
                                    <select
                                        value={alumnoSeleccionado}
                                        onChange={e => setAlumnoSeleccionado(e.target.value)}
                                        className="w-full sm:w-auto bg-slate-900 border border-slate-700 text-white font-bold text-xs sm:text-sm px-3.5 py-2 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                    >
                                        {CATALOGO_ALUMNOS.map(a => (
                                            <option key={a.id} value={a.nombre}>{a.nombre} ({a.centro})</option>
                                        ))}
                                    </select>
                                </div>

                                {/* Ficha de Alumno con sus Observaciones y Rutas */}
                                {(() => {
                                    const alumObj = CATALOGO_ALUMNOS.find(a => a.nombre === alumnoSeleccionado);
                                    if (!alumObj) return null;

                                    return (
                                        <div className="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 space-y-3">
                                            <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-700 pb-2">
                                                <div>
                                                    <h3 className="text-sm font-bold text-white">{alumObj.nombre}</h3>
                                                    <span className="text-xs text-indigo-300">Centro: {alumObj.centro} | Cuota: {alumObj.cuota} sesiones/semana</span>
                                                </div>
                                                <div className="bg-slate-900 px-3 py-1 rounded-xl border border-slate-700 text-xs text-slate-300">
                                                    <i className="fa-solid fa-circle-info text-indigo-400 mr-1.5"></i>
                                                    {alumObj.observaciones}
                                                </div>
                                            </div>

                                            {/* Cuadrante Semanal Combinado del Alumno (Fisio + Logopedia + TO + Piscina) */}
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left border-collapse text-xs">
                                                    <thead>
                                                        <tr className="bg-slate-900 text-slate-300 border-b border-slate-700">
                                                            <th className="p-2.5 font-bold">Día</th>
                                                            <th className="p-2.5 font-bold">Fisioterapia (Semanas 1 y 2)</th>
                                                            <th className="p-2.5 font-bold">Otras Disciplinas (Logopedia / TO)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-700/40">
                                                        {DIAS.map(dia => {
                                                            // Fisio asignado
                                                            const fisiosDia = Object.entries(sesiones).filter(([k, v]) => {
                                                                const [f, d_k, h_k] = k.split('_');
                                                                return d_k === dia && v.alumno === alumObj.nombre;
                                                            }).map(([k, v]) => {
                                                                const [f, d_k, h_k] = k.split('_');
                                                                return { fisio: f, hora: h_k, tipo: v.tipo, label: v.label, horaAgua: v.horaAgua };
                                                            });

                                                            // Otras disciplinas
                                                            const disciplinasDia = HORARIOS_OTRAS_DISCIPLINAS.filter(
                                                                o => o.alumno === alumObj.nombre && o.dia === dia
                                                            );

                                                            return (
                                                                <tr key={dia} className="hover:bg-slate-700/20">
                                                                    <td className="p-2.5 font-bold text-slate-300">{dia}</td>
                                                                    <td className="p-2.5">
                                                                        {fisiosDia.length === 0 ? (
                                                                            <span className="text-slate-500 italic">Sin sesión asignada</span>
                                                                        ) : (
                                                                            <div className="flex flex-wrap gap-2">
                                                                                {fisiosDia.map((fd, idx) => (
                                                                                    <span key={idx} className={`px-2.5 py-1 rounded-lg font-semibold border text-xs ${
                                                                                        fd.tipo === 'PISCINA' ? 'bg-cyan-950/80 border-cyan-500 text-cyan-200' : 'bg-emerald-950/80 border-emerald-500 text-emerald-200'
                                                                                    }`}>
                                                                                        {fd.hora} h - {fd.label} (Fisio: {fd.fisio}) {fd.horaAgua ? `[Agua: ${fd.horaAgua}]` : ''}
                                                                                    </span>
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                    <td className="p-2.5">
                                                                        {disciplinasDia.length === 0 ? (
                                                                            <span className="text-slate-500 italic">Libre</span>
                                                                        ) : (
                                                                            <div className="flex flex-wrap gap-2">
                                                                                {disciplinasDia.map((dd, idx) => (
                                                                                    <span key={idx} className="px-2.5 py-1 rounded-lg font-semibold bg-purple-950/80 border border-purple-500 text-purple-200 text-xs">
                                                                                        {dd.hora} h - {dd.disciplina}
                                                                                    </span>
                                                                                ))}
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}

                        {}
                        {/* VISTA 4: HORARIO REAL DE PISCINA SOLICITADO POR VIOLE */}
                        {vistaActual === "piscina" && (
                            <div className="space-y-4">
                                <div className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                    <div className="flex items-center gap-3">
                                        <i className="fa-solid fa-water text-cyan-400 text-xl"></i>
                                        <div>
                                            <h2 className="text-sm font-bold text-white">Planing General Real de Piscina (Semana {semana})</h2>
                                            <p className="text-xs text-slate-400">Desglose exacto con franjas escalonadas de vestuario, agua y regreso al aula.</p>
                                        </div>
                                    </div>

                                    {/* Selector de Semana */}
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => setSemana("1")}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-bold ${semana === "1" ? "bg-cyan-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}
                                        >
                                            Semana 1
                                        </button>
                                        <button
                                            onClick={() => setSemana("2")}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-bold ${semana === "2" ? "bg-cyan-500 text-slate-950" : "bg-slate-900 text-slate-400"}`}
                                        >
                                            Semana 2
                                        </button>
                                    </div>
                                </div>

                                {/* Tabla de Franjas Escalona de Piscina */}
                                <div className="bg-slate-800/80 rounded-2xl border border-slate-700 overflow-x-auto shadow-2xl">
                                    <table className="w-full text-left border-collapse text-xs min-w-[800px]">
                                        <thead>
                                            <tr className="bg-slate-900 text-slate-300 border-b border-slate-700">
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">Turno</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">Entrada Vestuario</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700 bg-cyan-950/60 text-cyan-300">ENTRADA AGUA</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">LUNES</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">MARTES</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">MIÉRCOLES</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700">JUEVES</th>
                                                <th className="p-2.5 font-bold text-center border-r border-slate-700 bg-cyan-950/60 text-cyan-300">SALIDA AGUA</th>
                                                <th className="p-2.5 font-bold text-center">Llegada Aula</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-700/40">
                                            {DETALLE_PISCINA_HORARIOS.map((det, idx) => {
                                                const piscinaActual = semana === "1" ? PISCINA_SEMANA_1 : PISCINA_SEMANA_2;

                                                return (
                                                    <tr key={idx} className="hover:bg-slate-700/20">
                                                        <td className="p-2 text-center font-bold text-slate-400 border-r border-slate-700">{det.turno}</td>
                                                        <td className="p-2 text-center text-slate-300 border-r border-slate-700">{det.vestuarioEntrada}</td>
                                                        <td className="p-2 text-center font-bold text-cyan-300 bg-cyan-950/30 border-r border-slate-700">{det.aguaEntrada}</td>

                                                        {/* Lunes, Martes, Miércoles, Jueves */}
                                                        {["LUNES", "MARTES", "MIÉRCOLES", "JUEVES"].map(dia => {
                                                            const itemPiscina = Object.values(piscinaActual).find(p => p.horaAgua?.startsWith(det.aguaEntrada));
                                                            const label = itemPiscina ? itemPiscina.alumno || itemPiscina.label : "-";

                                                            return (
                                                                <td key={dia} className="p-2 text-center border-r border-slate-700">
                                                                    <span className="px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-500/40 text-cyan-200 font-semibold text-[11px]">
                                                                        {label}
                                                                    </span>
                                                                </td>
                                                            );
                                                        })}

                                                        <td className="p-2 text-center font-bold text-cyan-300 bg-cyan-950/30 border-r border-slate-700">{det.aguaSalida}</td>
                                                        <td className="p-2 text-center text-slate-300">{det.aulaLlegada}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {}
                        {/* VISTA 5: DIRECTORIO DE ALUMNOS & CUOTAS */}
                        {vistaActual === "alumnos" && (
                            <div className="space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between gap-3 bg-slate-800/50 p-3.5 rounded-2xl border border-slate-700">
                                    <div className="flex-1 relative">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400"></i>
                                        <input
                                            type="text"
                                            placeholder="Buscar alumno por nombre..."
                                            value={alumnoBuscado}
                                            onChange={e => setAlumnoBuscado(e.target.value)}
                                            className="w-full bg-slate-900 border border-slate-700 pl-10 pr-4 py-2 rounded-xl text-xs sm:text-sm text-white focus:ring-2 focus:ring-indigo-500 outline-none"
                                        />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs text-slate-400">Centro:</span>
                                        <select
                                            value={filtroCentro}
                                            onChange={e => setFiltroCentro(e.target.value)}
                                            className="bg-slate-900 border border-slate-700 text-white text-xs px-3 py-2 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                                        >
                                            <option value="TODOS">Todos los centros</option>
                                            <option value="CEE">CEE</option>
                                            <option value="CDR">CDR</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {CATALOGO_ALUMNOS.filter(a => {
                                        const coincideNombre = a.nombre.toLowerCase().includes(alumnoBuscado.toLowerCase());
                                        const coincideCentro = filtroCentro === "TODOS" || a.centro === filtroCentro;
                                        return coincideNombre && coincideCentro;
                                    }).map(alumno => {
                                        const asignadas = Object.values(sesiones).filter(s => s.alumno === alumno.nombre).length;
                                        const completado = asignadas >= alumno.cuota;

                                        return (
                                            <div key={alumno.id} className="bg-slate-800/80 border border-slate-700 rounded-2xl p-4 space-y-3 relative overflow-hidden">
                                                <div className="flex justify-between items-start gap-2">
                                                    <div>
                                                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-700 text-indigo-300">
                                                            {alumno.centro}
                                                        </span>
                                                        <h3 className="font-bold text-white text-xs sm:text-sm mt-1">{alumno.nombre}</h3>
                                                    </div>
                                                    <span className={`px-2 py-1 rounded-full text-xs font-bold whitespace-nowrap ${
                                                        completado ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
                                                    }`}>
                                                        {asignadas} / {alumno.cuota} sesiones
                                                    </span>
                                                </div>

                                                <p className="text-xs text-slate-400 bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 leading-relaxed">
                                                    <i className="fa-solid fa-circle-info text-indigo-400 mr-1.5"></i>
                                                    {alumno.observaciones}
                                                </p>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {}
                        {/* VISTA 6: AUDITORÍA & SOLAPAMIENTOS */}
                        {vistaActual === "auditoria" && (
                            <div className="space-y-4">
                                <div className="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <i className="fa-solid fa-triangle-exclamation text-amber-400 text-xl"></i>
                                        <div>
                                            <h2 className="text-sm font-bold text-white">Informe de Validación e Integración</h2>
                                            <p className="text-xs text-slate-400">Comprobación de cuotas e incompatibilidades con Logopedia/TO.</p>
                                        </div>
                                    </div>
                                    <span className="text-xs font-bold px-3 py-1 bg-amber-500/20 text-amber-300 rounded-full border border-amber-500/30">
                                        {auditoria.length} Registros
                                    </span>
                                </div>

                                {auditoria.length === 0 ? (
                                    <div className="bg-emerald-950/30 border border-emerald-500/30 rounded-2xl p-8 text-center space-y-3">
                                        <i className="fa-solid fa-circle-check text-4xl text-emerald-400"></i>
                                        <h3 className="text-base font-bold text-emerald-200">¡Cuadrante Validad con Éxito!</h3>
                                        <p className="text-xs text-emerald-300/80 max-w-md mx-auto">
                                            Todos los alumnos disponen de sus sesiones completadas y no existe ningún solapamiento horario.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="space-y-2">
                                        {auditoria.map((aviso, idx) => (
                                            <div
                                                key={idx}
                                                className={`p-3.5 rounded-xl border text-xs flex items-center justify-between ${
                                                    aviso.tipo === 'solapamiento'
                                                        ? 'bg-rose-950/60 border-rose-500/50 text-rose-200'
                                                        : 'bg-amber-950/40 border-amber-500/40 text-amber-200'
                                                }`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <i className={`fa-solid ${aviso.tipo === 'solapamiento' ? 'fa-ban text-rose-400' : 'fa-clock text-amber-400'}`}></i>
                                                    <span className="font-medium">{aviso.mensaje}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {}
                    {/* Modal de Asignación / Edición Manual */}
                    {modalAsignacion && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl animate-scaleIn">
                                <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                    <h3 className="font-bold text-white text-sm">
                                        Asignar Sesión ({modalAsignacion.fisio} - {modalAsignacion.dia} {modalAsignacion.hora})
                                    </h3>
                                    <button onClick={() => setModalAsignacion(null)} className="text-slate-400 hover:text-white p-1">
                                        <i className="fa-solid fa-xmark text-base"></i>
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <label className="text-xs font-semibold text-slate-300 block">Seleccionar Alumno (45 minutos):</label>
                                    <select
                                        id="selectAlumnoModal"
                                        defaultValue={modalAsignacion.actual?.alumno || ""}
                                        className="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs sm:text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                    >
                                        <option value="">-- Hueco libre / Vaciar --</option>
                                        {CATALOGO_ALUMNOS.map(a => (
                                            <option key={a.id} value={a.nombre}>{a.nombre} ({a.centro})</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="flex gap-2 justify-end border-t border-slate-700 pt-4">
                                    <button
                                        onClick={() => setModalAsignacion(null)}
                                        className="px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-700"
                                    >
                                        Cancelar
                                    </button>
                                    <button
                                        onClick={() => {
                                            const sel = document.getElementById("selectAlumnoModal");
                                            guardarAsignacionManual(sel.value);
                                        }}
                                        className="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                                    >
                                        Guardar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
